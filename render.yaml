# One project with three services: the HTTP API, the answer_question workflow, and the snapshot
# refresh cron. Region is oregon because Sandboxes early access runs only there. No database.
#
# Every secret is declared on the service that uses it, not in an env group: the Blueprint form
# doesn't reliably prompt for sync: false values inside env groups. A value left blank counts as unset.

projects:
  - name: codebase-researcher
    environments:
      - name: production
        services:
          - type: web
            name: codebase-researcher-api
            runtime: node
            region: oregon
            # Free is enough: it spins down when idle, so the first request afterward waits for a cold start,
            # but questions run in the workflow, not here. Use starter to keep it warm.
            plan: free
            buildCommand: pnpm install --frozen-lockfile
            startCommand: pnpm start:api
            healthCheckPath: /healthz
            buildFilter:
              paths: [src/api.ts, src/question.ts, src/investigation.ts, src/callback.ts, src/callback-policy.ts, src/log.ts, src/util.ts, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .node-version, tsconfig.json]
            envVars:
              - key: RENDER_API_KEY
                sync: false
              - key: API_TOKEN
                generateValue: true
              - key: QUESTION_ID_SECRET
                generateValue: true
              - key: WORKFLOW_SLUG
                fromService:
                  type: workflow
                  name: codebase-researcher-workflow
                  property: slug
              # Optional: set identical HTTPS origins on the API and workflow. Blank disables callbacks.
              - key: CALLBACK_ALLOWED_ORIGINS
                sync: false

          - type: workflow
            name: codebase-researcher-workflow
            runtime: node
            region: oregon
            buildCommand: pnpm install --frozen-lockfile
            startCommand: pnpm start:workflow
            buildFilter:
              paths: [src/**, sandbox/**, config.ts, prompt.md, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .node-version]
            envVars:
              - key: RENDER_API_KEY
                sync: false
              - key: RENDER_WORKSPACE_ID
                # Optional when the key can see exactly one workspace.
                sync: false
              - key: MODEL_PROVIDER
                value: anthropic
              - key: MODEL
                value: claude-opus-5
              # Use a dedicated, spend-capped key: DNS still resolves inside Sandboxes.
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: SANDBOX_NETWORK_POLICY
                value: allow-list
              # Must match the API setting. The delivery subtask checks it independently.
              - key: CALLBACK_ALLOWED_ORIGINS
                sync: false

          - type: cron
            name: codebase-researcher-snapshots
            runtime: node
            region: oregon
            # Bundling the runner needs more than starter's 512 MB; the build is killed without a log line.
            plan: standard
            schedule: "0 * * * *"
            buildCommand: pnpm install --frozen-lockfile
            startCommand: pnpm refresh
            buildFilter:
              paths: [src/**, sandbox/**, config.ts, prompt.md, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .node-version]
            envVars:
              - key: RENDER_API_KEY
                sync: false
              - key: RENDER_WORKSPACE_ID
                # Optional when the key can see exactly one workspace.
                sync: false
              - key: GITHUB_TOKEN
                sync: false
